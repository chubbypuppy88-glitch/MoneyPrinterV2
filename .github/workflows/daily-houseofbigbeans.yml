name: Daily HouseOfBigBeans Short

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: Optional YYYY-MM-DD topic date
        required: false
        type: string
      privacy:
        description: YouTube visibility
        required: true
        default: public
        type: choice
        options: [private, unlisted, public]

permissions:
  contents: read

concurrency:
  group: houseofbigbeans-daily
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free local media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --disable-pip-version-check requests Pillow

      - name: Smoke-test exact renderer
        run: |
          python scripts/daily_houseofbigbeans.py --smoke --date 2026-10-25 --outdir outputs/smoke
          ffprobe -v error -show_entries stream=codec_name,width,height -of json outputs/smoke/HouseOfBigBeans-daily.mp4

      - name: Prepare YouTube OAuth files
        env:
          YOUTUBE_CLIENT_JSON: ${{ secrets.YOUTUBE_CLIENT_JSON }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
        run: |
          test -n "$YOUTUBE_CLIENT_JSON" || { echo "Missing YOUTUBE_CLIENT_JSON secret"; exit 2; }
          test -n "$YOUTUBE_TOKEN_JSON" || { echo "Missing YOUTUBE_TOKEN_JSON secret"; exit 2; }
          printf '%s' "$YOUTUBE_CLIENT_JSON" > youtube_oauth_client.json
          printf '%s' "$YOUTUBE_TOKEN_JSON" > .youtube_oauth_token.json
          chmod 600 youtube_oauth_client.json .youtube_oauth_token.json

      - name: Generate four fresh AI scenes and upload today's Short
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          YOUTUBE_CLIENT_FILE: youtube_oauth_client.json
          YOUTUBE_TOKEN_FILE: .youtube_oauth_token.json
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS }}
        run: |
          test -n "$POLLINATIONS_API_KEY" || { echo "Missing POLLINATIONS_API_KEY secret"; exit 2; }
          DATE="${{ inputs.date }}"
          [ -n "$DATE" ] || DATE="$(date -u +%F)"
          PRIVACY="${{ inputs.privacy }}"
          [ -n "$PRIVACY" ] || PRIVACY="${YOUTUBE_PRIVACY_STATUS:-public}"
          python scripts/daily_houseofbigbeans.py --date "$DATE" --outdir outputs/daily --upload --privacy "$PRIVACY"

      - name: Keep generated Short and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: houseofbigbeans-${{ github.run_id }}
          retention-days: 7
          path: |
            outputs/daily/HouseOfBigBeans-daily.mp4
            outputs/daily/manifest.json
