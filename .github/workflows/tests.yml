name: Python regression checks

on:
  push:
    branches: [main, 'fix/houseofbigbeans-local-preview']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version
      - name: Install isolated test dependencies
        run: python -m pip install httpx requests termcolor srt_equalizer schedule prettytable 'moviepy==1.0.3' 'numpy>=1.26,<2' 'Pillow>=10'
      - name: Compile application and tests
        run: python -m compileall -q src scripts tests
      - name: Run unit tests without provider credentials
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee unit-results.txt
      - name: Render synthetic media with real MoviePy and FFmpeg
        run: |
          set -o pipefail
          python scripts/smoke_render.py 2>&1 | tee render-results.txt
      - name: Preserve validation results and source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-source-snapshot
          retention-days: 3
          path: |
            unit-results.txt
            render-results.txt
            src/**/*.py
            src/*.py
            scripts/*.py
            scripts/*.sh
            tests/*.py
            docs/LocalPreview.md
            outputs/smoke-render-results.json
            config.example.json
            requirements.txt
            AGENTS.md
